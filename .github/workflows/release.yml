name: Build desktop releases

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
          - os: macos-14
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm cuiqiu_qt.spec
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/CuiqiuCaptcha.exe -DestinationPath CuiqiuCaptcha-${{ matrix.suffix }}.zip
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/CuiqiuCaptcha CuiqiuCaptcha-${{ matrix.suffix }}.zip
      - name: Upload directly to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CuiqiuCaptcha-${{ matrix.suffix }}.zip
          generate_release_notes: true
